services:
  # Local demo stack — HTTP on :3000. For janark.org (or any public host):
  # terminate TLS at Cloudflare/Caddy/nginx, set NEXT_PUBLIC_SITE_URL=https://…,
  # and do NOT set ALLOW_HTTP_SITE_URL. Pass AdSense vars from the host .env.
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - janark_mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
        NEXT_PUBLIC_ADS_ENABLED: ${NEXT_PUBLIC_ADS_ENABLED:-}
        NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: ${NEXT_PUBLIC_ADSENSE_PUBLISHER_ID:-}
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DATABASE_URL: file:/data/janark.db
      MONGODB_URI: mongodb://mongo:27017/janark
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      # Local compose demo is HTTP — required so prod security checks allow http://localhost
      ALLOW_HTTP_SITE_URL: ${ALLOW_HTTP_SITE_URL:-1}
      NEXT_PUBLIC_ADS_ENABLED: ${NEXT_PUBLIC_ADS_ENABLED:-}
      NEXT_PUBLIC_ADSENSE_PUBLISHER_ID: ${NEXT_PUBLIC_ADSENSE_PUBLISHER_ID:-}
      ADS_TXT_LINES: ${ADS_TXT_LINES:-}
      NEXT_PUBLIC_ADSENSE_SLOT_HOME_TOP: ${NEXT_PUBLIC_ADSENSE_SLOT_HOME_TOP:-}
      NEXT_PUBLIC_ADSENSE_SLOT_FEED_TOP: ${NEXT_PUBLIC_ADSENSE_SLOT_FEED_TOP:-}
      NEXT_PUBLIC_ADSENSE_SLOT_FEED_MIDDLE: ${NEXT_PUBLIC_ADSENSE_SLOT_FEED_MIDDLE:-}
      NEXT_PUBLIC_ADSENSE_SLOT_POST_BOTTOM: ${NEXT_PUBLIC_ADSENSE_SLOT_POST_BOTTOM:-}
      NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR: ${NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR:-}
      NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR_BELOW_TRENDING: ${NEXT_PUBLIC_ADSENSE_SLOT_SIDEBAR_BELOW_TRENDING:-}
      NEXT_PUBLIC_ADSENSE_SLOT_MOBILE_BOTTOM: ${NEXT_PUBLIC_ADSENSE_SLOT_MOBILE_BOTTOM:-}
      # Use DOCKER_* so a local .env with weak/dev salts does not break production checks
      PHONE_HASH_SALT: ${DOCKER_PHONE_HASH_SALT:-docker-local-phone-hash-salt-min-24}
      HUMAN_TOKEN_SECRET: ${DOCKER_HUMAN_TOKEN_SECRET:-docker-local-human-token-secret-24}
      IP_HASH_SALT: ${DOCKER_IP_HASH_SALT:-docker-local-ip-hash-salt-min-24xx}
      # Compose demo: no SMS provider — echo OTP in the UI (never for real hosting)
      ALLOW_OTP_WITHOUT_SMS: ${ALLOW_OTP_WITHOUT_SMS:-1}
      EXPOSE_DEV_OTP: ${DOCKER_EXPOSE_DEV_OTP:-1}
    volumes:
      - janark_sqlite:/data
      - janark_uploads:/app/apps/web/public/uploads
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  janark_mongo:
  janark_sqlite:
  janark_uploads:
