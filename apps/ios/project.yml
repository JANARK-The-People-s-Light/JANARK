name: Janark
options:
  bundleIdPrefix: org.janark
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  BASE_SDK: iphoneos
  TARGETED_DEVICE_FAMILY: "1,2"
  SWIFT_VERSION: "5.0"
targets:
  Janark:
    type: application
    platform: iOS
    sources:
      - path: Janark
        excludes:
          - "**/*.md"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: org.janark.app
      PRODUCT_NAME: Janark
      INFOPLIST_FILE: Janark/Info.plist
      GENERATE_INFOPLIST_FILE: false
      CURRENT_PROJECT_VERSION: 1
      MARKETING_VERSION: 1.0
      TARGETED_DEVICE_FAMILY: "1,2"
      SWIFT_STRICT_CONCURRENCY: minimal
    info:
      path: Janark/Info.plist
      properties:
        UILaunchScreen: {}
